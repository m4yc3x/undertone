[package]
name = "utclient"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.0", features = ["full"] }
webrtc = "0.10.1" # This is a placeholder, replace with actual WebRTC crate
aes-gcm = "0.9.0" # For AES encryption, part of the double-ratchet algorithm
hkdf = "0.11.0" # For key derivation in the double-ratchet algorithm
chrono = "0.4"
colored = "2.0"
clap = "2.33.0"
tokio-tungstenite = "0.15.0"
uuid = "0.8.2"
futures = "0.3"
rand = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"